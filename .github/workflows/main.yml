name: Generate Snake

on:
  schedule:
    # Roda a cada 12 horas (pode ajustar)
    - cron: "0 */12 * * *" 
  workflow_dispatch:

jobs:
  generate_snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite que a ação escreva no repositório (salve o SVG/GIF)
      
    steps:
      - uses: actions/checkout@v3
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: CarollineR # SEU NOME DE USUÁRIO
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
